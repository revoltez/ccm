{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ccm.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ccm.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ccm.fullname" . }}
  labels:
    {{- include "ccm.labels" . | nindent 4 }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ccm.fullname" . }}
  labels:
    {{- include "ccm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ccm.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ccm.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
