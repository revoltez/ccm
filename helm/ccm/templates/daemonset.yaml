apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ccm
  labels:
    app.kubernetes.io/name: ccm
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ccm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ccm
    spec:
      serviceAccountName: cloud-controller-manager
      automountServiceAccountToken: true
      tolerations:
        - key: "node.cloudprovider.kubernetes.io/uninitialized"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: ccm
          image: ccm:latest
          imagePullPolicy: IfNotPresent
          command:
            - /ccm
          args:
            - --cloud-provider=external
            - --leader-elect=true
            - --use-service-account-credentials=true
            - --cluster-name=ccm
