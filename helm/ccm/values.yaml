image:
  repository: ccm
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

rbac:
  create: true
  serviceAccount:
    name: cloud-controller-manager

pod:
  annotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

hostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

tolerations:
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"
  - key: "node-role.kubernetes.io/control-plane"
    operator: "Exists"
    effect: "NoSchedule"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  enabled: false

readinessProbe:
  enabled: false

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

priorityClassName: system-node-critical
